name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Anti-triche — aucun test désactivé
        run: |
          if grep -rnE '\.(skip|todo|only)\(' --include='*.ts' --include='*.tsx' tests/ e2e/ src/; then
            echo "❌ test désactivé détecté (.skip/.todo/.only) dans tests/, e2e/ ou src/."
            echo "   Un test qui gêne se corrige ou se supprime avec la spec, il ne se désactive pas."
            exit 1
          fi

      - name: Tests unitaires + intégration
        run: npm test -- --run --coverage

      # Bloquant sur "critical" et non "high" : Next embarque des deps
      # (postcss, sharp) avec des avis "high" non corrigeables sans downgrade
      # majeur. Voir docs/decisions.md. À revoir à chaque bump de Next.
      - name: Audit dépendances (bloquant sur critical)
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  e2e:
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts build + démarre l'app lui-même quand CI=true.
      - name: Tests e2e
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
